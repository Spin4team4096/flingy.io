    <script>

        if (window.location.hostname == 'cobbled.io' || window.location.hostname == 'beta.cobbled.io') {
            console.log('%c🔴🔴🔴 YOU\'RE ON THE NON-LOCAL VERSION THAT\'S PUSHED ONLINE (may be outdated)🔴🔴🔴', 'background: rgba(255,0,0,0.5); color: black; font-size: 16px; font-weight: bold; padding: 4px;')
        } else {
            console.log('%c✅ You\'re local, all good', 'background: rgba(0,255,0,0.2); color: black; font-size: 16px; padding: 4px;')
        }
        
        // Setup

        // UI Setup
        fov = 360 // iirc
        scale = 1
        uiScale = 1

        const canvas = document.getElementById('game')
        const ctx = canvas.getContext('2d')

        // Firebase Setup

        watchFirebaseServers("cobbled4/lobbies")
        watchFirebaseStatus("cobbled4/status", 'cobbled_v4_statusMessage')
        
        // Event Listeners

        addEventListener('resize', resize)
        function resize() {
            canvas.width = Math.round(innerWidth*devicePixelRatio*settings.resolutionScale)
            canvas.height = Math.round(innerHeight*devicePixelRatio*settings.resolutionScale)

            scale = Math.max(canvas.width/(fov*16/9), canvas.height/fov)
            uiScale = Math.max(innerWidth, innerHeight*16/9)/1920*settings.uiScale

            document.documentElement.style.setProperty('--ui', uiScale)
            ctx.setTransform(scale, 0, 0, scale, canvas.width/2, canvas.height/2)
        }

        addEventListener('keydown', e => {
            if (settings.keybinds.toggleSettings.includes(e.key.toLowerCase()) && !e.repeat) toggleSettings()
            if (settings.keybinds.toggleChangelog.includes(e.key.toLowerCase()) && !e.repeat) toggleChangelog()
            if (settingsPage != 0) {
                if (e.key == '0' && !e.repeat) {
                    settingsPage = 1
                    renderPanel(ui.settings, settingsData[settingsPage])
                    playSound('bwooop', 1, 0.9)
                }
                if (e.key == '1' && !e.repeat) {
                    settingsPage = 2
                    renderPanel(ui.settings, settingsData[settingsPage])
                    playSound('bwooop', 1, randomFloat(0.9,1.1))
                }
                if (e.key == '2' && !e.repeat) {
                    settingsPage = 3
                    renderPanel(ui.settings, settingsData[settingsPage])
                    playSound('bwooop', 1, randomFloat(0.9,1.1))
                }
                if (e.key == '3' && !e.repeat) {
                    settingsPage = 4
                    renderPanel(ui.settings, settingsData[settingsPage])
                    playSound('bwooop', 1, randomFloat(0.9,1.1))
                }
            }
            if (settings.keybinds.showPerformance.includes(e.key.toLowerCase()) && !e.repeat && settings.showPerformanceActivation == 'toggle') performanceOpen = !performanceOpen
            if (settings.keybinds.showDebug.includes(e.key.toLowerCase()) && !e.repeat && settings.showDebugActivation == 'toggle') debugOpen = !debugOpen
            if (settings.keybinds.renderDebug.includes(e.key.toLowerCase()) && !e.repeat && settings.renderDebugActivation == 'toggle') renderDebugOpen = !renderDebugOpen
            if (settings.keybinds.toggleLeaderboard.includes(e.key.toLowerCase()) && !e.repeat) settings.showLeaderboard = !settings.showLeaderboard
            if (settings.keybinds.toggleMinimap.includes(e.key.toLowerCase()) && !e.repeat) settings.showMinimap = !settings.showMinimap
        })

        // Specific Functions

        function pickServer() {
            console.log(`Picking server...`)

            let available = []

            for (const id in servers) {
                if (invalidServers[id]) continue
                if (Date.now()-(servers[id].lastSeen || 0) > 10*60*1000) continue
                if (servers[id].status != 0) continue
                if (!servers[id].config) continue
                available.push({id: id, players: servers[id].playerCount || 0})
            }

            if (available.length == 0 && Object.keys(invalidServers).length) {
                invalidServers = {}
            }

            if (available.length == 0) {
                console.log("no joinable servers")
                animations.playButton.result = Object.keys(servers || {}).length == 0 ? 2 : 3
                playSound('negativeaction2')
                ui.menu.message.textContent = `No joinable servers`
                setTimeout(() => {
                    animations.playButton.state = 2
                }, 100)
                // in the future, make it wait for a server to be available, since that's the point after all
                return
            }

            available.sort((a,b) => b.players-a.players)

            server = available[0]
            connect(server.id, servers[server.id].url)
        }

        function connect(id, url) {
            if (ws) ws.close()

            prev = curr = null
            lobby.id = id
            lobby.url = url
            lobby.config = servers[id].config
            lobby.player = []
            for (let i = 0; i < lobby.config.playerLimit; i++) {
                lobby.player.push({
                    active: false, // now this is actually game-specific, hmmm. i could probably move this out of the connect function then? or pass in smth to this function
                })
            }

            console.log(`Connecting to server: ${id} (${url})`)
            ui.menu.message.textContent = `Connecting to lobby ${lobby.id}`
            ws = new WebSocket(url)
            ws.binaryType = "arraybuffer"
            
            ws.addEventListener('open', () => {
                console.log(`Connected to websocket of lobby ${id} (${url})`)
                ws.send(encodePacket(-1, {
                    id: id,
                    username: username,
                }))
            })

            ws.addEventListener('message', (event) => {
                decodePacket(event.data)
            })

            ws.addEventListener('close', (event) => {
                console.log(`Disconnected from lobby ${id} (${url}) - Code: ${event.code}, Reason: ${event.reason}, WasClean: ${event.wasClean}`)
                playerSlot = -1
            })

            ws.addEventListener('error', () => {
                console.log(`Connection error on lobby ${id} (${url})`)
            })
        }

        function encodePacket(packetType, data) {
            version = 1
            switch (packetType) {
                case -1: {
                    let lobbyID = new TextEncoder().encode(data.id)
                    let usernameText = new TextEncoder().encode(data.username)

                    let bufferSize = 2+1+lobbyID.length+1+usernameText.length
                    let buffer = new ArrayBuffer(bufferSize)
                    let packet = new DataView(buffer)
                    let i = 0
                    packet.setUint8(i, version) ;i += 1
                    packet.setInt8(i, packetType) ;i += 1

                    packet.setUint8(i, lobbyID.length, true) ;i += 1
                    for (let j=0; j < lobbyID.length; j++) {
                        packet.setUint8(i+j, lobbyID[j])
                    }
                    i += lobbyID.length

                    packet.setUint8(i, usernameText.length, true) ;i += 1
                    for (let j=0; j < usernameText.length; j++) {
                        packet.setUint8(i+j, usernameText[j])
                    }
                    i += usernameText.length

                    return packet
                } break
                default: console.warn(`idk what packet ${packetType} is`) ;return null
            }
        }
        
        function decodePacket(data) {
            let packet = new DataView(data)
            let i = 0
            let version = packet.getUint8(i) ;i += 1
            if (version != 1) {console.warn(`outdated version ${version}, wtf!?`); return}
            let packetType = packet.getInt8(i) ;i += 1
            switch (packetType) {
                case 1: {
                    playerSlot = packet.getUint16(i,true) ;i += 2
                    console.log(`Connected to lobby as player ${playerSlot}`)
                    ui.menu.message.textContent = `Connected to lobby ${lobby.id}`
                    animations.playButton.result = 1
                    playSound('matchfound2', 0.5)
                    scene = 1
                    animations.playButton.state = 1
                    setTimeout(() => {
                        animations.playButton.state = 2
                    }, 500)
                } break
                case 2: {
                    disconnectReason = packet.getUint8(i) ;i += 1
                    console.log(`Disconnected for reason ${disconnectReason}`)

                    if (disconnectReason == 1) invalidServers[lobby.id] = true
                    disconnectReasons = {
                        1: `Lobby ${lobby.id} doesn't exist`,
                        2: `Lobby ${lobby.id} is full`,
                        3: `Duplicate connection to ${lobby.id}`,
                        4: `Lobby ${lobby.id} is already ingame`,
                    }
                    ui.menu.message.textContent = disconnectReasons[disconnectReason]
                    animations.playButton.result = 2
                    animations.playButton.state = 2
                    playSound('negativeaction2')
                    ws.close()
                } break
                default: console.warn(`idk what packet ${packetType} is`) ;break
            }
            
        }

        function interpolateLobby(a) {
            // specific to this game
        }

        // init 
        server = null
        servers = {}
        invalidServers = {}
        prev = null
        curr = null
        lobby = {
            id: null,
            config: {},
            tick: -1,
            running: false,
            closing: false,
            state: 0,
            tps: 0,
            player: [],
            // and more cuz lobby is kinda unique
        }
        tips = [
            "***DRINK WATER***",
            "This menu background is very temporary lol",
            "Press **F/I/O** to show fps/ping or debug",
            "I am *super* proud of this UI :D",
            "This game was **NOT** vibe-coded.",
            "You can press **esc/tab** to open the left sidebar panels!",
            "You can use numbers like **0/1/2/3** to navigate settings."
        ]
        settings = {
            uiScale: 1,
            volume: 1,
            animationTime: 1,
            spinTime: 1,
            showLeaderboard: true,
            showMinimap: true,
            resolutionScale: 0.75,
            imageScaling: 'auto',
            smoothing: 'predict',
            showPerformanceActivation: 'toggle',
            showDebugActivation: 'toggle',
            renderDebugActivation: 'toggle',
            keybinds: {
                showPerformance: ['f'],
                showDebug: ['i'],
                renderDebug: ['o'],
                toggleSettings: ['escape'],
                toggleChangelog: ['tab'],
                toggleLeaderboard: ['p'],
                toggleMinimap: ['m'],
            }
        }
        playerSlot = -1
        playerColor = 'red'
        unlockedColors = []
        remainingColors = []
        coins = 0
        colorPrice = Infinity
        settingsPage = 0
        changelogOpen = false
        performanceOpen = false
        debugOpen = false
        renderDebugOpen = false
        menuBgX = 0
        menuBgY = 0
        cameraX = 0
        cameraY = 0
        cameraTargetX = 0
        cameraTargetY = 0
        cameraSpeed = 0
        deathScreenOpacity = 0
        inputTimer = 0
        scene = 0
        ws = null
        let fpsFrames = 0, fpsWindow = performance.now(), fpsAvg = 0, fpsLast = 0
        let mspfSum = 0, mspfCount = 0, mspfAvg = 0, mspfLast = 0
        resize()
        

        // render loop
        lastFrame = performance.now()

        function frame(now) {
            requestAnimationFrame(frame)
            let frameStart = performance.now()

            let dt = Math.min((now-lastFrame)/1000*30, 1.5)
            lastFrame = now

            // interpolate
            if (settings.smoothing != "off") {
                if (prev && curr) {
                    interpolateLobby(clamp((performance.now()-curr.timestamp)/(1000/30), 0, 1))
                }
            } else if (curr) {
                prev = curr = null
            }

            // render html // render ui

            remainingColors = playerColors.filter(c => !unlockedColors.includes(c))
            colorPrice = unlockedColors.length-3

            ui.menu.shop.buyColor.classList.toggle('poor', coins < colorPrice)
            ui.menu.shop.buyColor.classList.toggle('rich', coins >= colorPrice && remainingColors.length != 0)
            ui.menu.shop.buyColor.classList.toggle('maxed', remainingColors.length == 0)
            ui.menu.shop.coins.textContent = `Coins: ${coins}🪙`
            
            // menu // button animations
            switch (animations.colorButton.type) {
                case 0: {
                    ui.menu.shop.buyColor.textContent = `Buy Color: ${colorPrice}🪙`
                    ui.menu.shop.buyColor.style.setProperty('--c', `var(--${remainingColors[Math.floor(Date.now()/1000)%remainingColors.length]})`)
                    ui.menu.shop.buyColor.style.setProperty('--c-outline', `var(--${remainingColors[Math.floor(Date.now()/1000)%remainingColors.length]}-outline)`)
                } break
                case 1: {
                    ui.menu.shop.buyColor.textContent = `Spinning...`
                    switch (animations.colorButton.state) {
                        case 1: {
                            animations.colorButton.time += dt/settings.spinTime
                            if (animations.colorButton.time >= 15) {
                                animations.colorButton.state = 2
                            }
                            animations.colorButton.speed += animations.colorButton.acceleration*dt/settings.spinTime
                            animations.colorButton.speed *= Math.pow(0.98, dt/settings.spinTime)
                            animations.colorButton.angle += animations.colorButton.speed*dt/settings.spinTime
                        } break
                        case 2: {
                            let threshold = 0.25
                            animations.colorButton.speed *= Math.pow(0.98, dt/settings.spinTime)
                            animations.colorButton.angle += animations.colorButton.speed*dt/settings.spinTime
                            if (animations.colorButton.speed < threshold) {
                                animations.colorButton.type = 2
                                animations.colorButton.from = animations.colorButton.angle
                                animations.colorButton.to = Math.round(animations.colorButton.angle/90)*90
                                animations.colorButton.progress = 0
                                animations.colorButton.speed = 0
                                playerColor = remainingColors[animations.colorButton.result]
                                unlockedColors.push(playerColor)
                                unlockedColors.sort((a, b) => playerColors.indexOf(a)-playerColors.indexOf(b))
                                playSound('bonus')
                            }
                        } break
                    }

                    let crossing = Math.floor(animations.colorButton.angle/90)
                    if (crossing > animations.colorButton.lastCrossing) {
                        if (remainingColors.length > 1) {
                            let oldResult = animations.colorButton.result
                            animations.colorButton.result = randomInt(0,remainingColors.length-2)
                            if (animations.colorButton.result >= oldResult) animations.colorButton.result++
                        }
                        animations.colorButton.lastCrossing = crossing
                        playSound('bwooop', 1, randomFloat(0.9,1.1))
                    }

                    ui.menu.menuControls.colorButton.style.setProperty('--angle', animations.colorButton.angle + 'deg')
                    ui.menu.menuControls.colorButton.style.setProperty('--c', `var(--${remainingColors[animations.colorButton.result]})`)
                    ui.menu.menuControls.colorButton.style.setProperty('--c-outline', `var(--${remainingColors[animations.colorButton.result]}-outline)`)
                    ui.menu.shop.buyColor.style.setProperty('--c', `var(--${remainingColors[animations.colorButton.result]})`)
                    ui.menu.shop.buyColor.style.setProperty('--c-outline', `var(--${remainingColors[animations.colorButton.result]}-outline)`)

                } break
                case 2: {
                    if (animations.colorButton.progress < 1) {
                        animations.colorButton.progress = Math.min(animations.colorButton.progress+dt/(7.5*settings.animationTime), 1)
                        animations.colorButton.angle = animations.colorButton.from+(animations.colorButton.to-animations.colorButton.from)*animations.colorButton.progress*animations.colorButton.progress*(3-2*animations.colorButton.progress)
                        ui.menu.menuControls.colorButton.style.setProperty('--angle', animations.colorButton.angle + 'deg')
                        if (animations.colorButton.progress >= 1) {animations.colorButton.angle = animations.colorButton.from = animations.colorButton.to = animations.colorButton.type = 0}
                    }
                } break
            }

            switch (animations.playButton.type) {
                case 1: {
                    switch (animations.playButton.state) {
                        case 1: {
                            animations.playButton.time += dt
                            if (animations.playButton.time >= 3*30 && playerSlot == -1) {
                                animations.playButton.result = 2
                                invalidServers[lobby.id] = true
                                ui.menu.message.textContent = `failed to connect to ${lobby.id}`
                                animations.playButton.state = 2
                                playSound('negativeaction2')
                                ws.close()
                            }
                            animations.playButton.speed += 3.58*dt/settings.spinTime
                            animations.playButton.speed *= Math.pow(0.905, dt/settings.spinTime)
                            animations.playButton.angle += animations.playButton.speed*dt/settings.spinTime
                        } break
                        case 2: {
                            let threshold = 0.1
                            animations.playButton.speed *= (Math.round((animations.playButton.angle+animations.playButton.speed*9.526)/90)*90-animations.playButton.angle)/(Math.round((animations.playButton.angle+animations.playButton.speed*9.526)/90)*90-animations.playButton.angle+(animations.playButton.speed-threshold)*dt/settings.spinTime)
                            animations.playButton.angle += animations.playButton.speed*dt/settings.spinTime
                            if (animations.playButton.speed < threshold) {
                                animations.playButton.type = 0
                                animations.playButton.state = 0
                                animations.playButton.angle = 0
                                animations.playButton.speed = 0
                                if (animations.playButton.result == 1) {animations.playButton.result = 0}
                            }
                        } break
                    }
                    ui.menu.menuControls.playButton.style.setProperty('--angle', animations.playButton.angle + 'deg')
                } break
            }
            ui.menu.menuControls.playButton.classList.toggle('waiting', animations.playButton.result === 3)
            ui.menu.menuControls.playButton.classList.toggle('retry', animations.playButton.result === 2)
            ui.menu.menuControls.playButton.classList.toggle('finished', animations.playButton.result === 1)

            if (animations.settingsButton.progress < 1) {
                animations.settingsButton.progress = Math.min(animations.settingsButton.progress+dt/(7.5*settings.animationTime), 1)
                animations.settingsButton.angle = (3-2*animations.settingsButton.type)*90*animations.settingsButton.progress*animations.settingsButton.progress*(3-2*animations.settingsButton.progress)
                ui.menu.bottomRow.settingsButton.style.setProperty('--angle', animations.settingsButton.angle + 'deg')
                if (animations.settingsButton.progress >= 1) {animations.settingsButton.angle = 0}
            }
            if (animations.changelogButton.progress < 1) {
                animations.changelogButton.progress = Math.min(animations.changelogButton.progress+dt/(7.5*settings.animationTime), 1)
                animations.changelogButton.angle = (3-2*animations.changelogButton.type)*90*animations.changelogButton.progress*animations.changelogButton.progress*(3-2*animations.changelogButton.progress)
                ui.menu.bottomRow.changelogButton.style.setProperty('--angle', animations.changelogButton.angle + 'deg')
                if (animations.changelogButton.progress >= 1) {animations.changelogButton.angle = 0}
            }
            if (animations.discordButton.progress < 1) {
                animations.discordButton.progress = Math.min(animations.discordButton.progress+dt/(7.5*settings.animationTime), 1)
                animations.discordButton.angle = 180*animations.discordButton.progress*animations.discordButton.progress*(3-2*animations.discordButton.progress)
                ui.menu.bottomRow.discordButton.style.setProperty('--angle', animations.discordButton.angle + 'deg')
                if (animations.discordButton.progress >= 1) {animations.discordButton.angle = 0}
            }

            // HUD html

            // Scenes

            ui.menu.myself.classList.toggle('hidden', scene != 0)
            if (scene != 0) {ui.menu.tips.style.opacity = 0}
            ui.hud.myself.classList.toggle('hidden', scene == 0)
            if (lobby.state == 3) ui.menu.message.textContent = `Game over! Play again?`

            if (playerSlot >= 0) {
                // scene calc

                // camera
                
                // input
                worldMouseX = (mouseX/scale)+cameraX
                worldMouseY = (mouseY/scale)+cameraY

                // input packet
            } else {
                scene = 0
            }

            // render shit
            ctx.clearRect(-canvas.width/scale/2, -canvas.height/scale/2, canvas.width/scale, canvas.height/scale)

            screenSizeX = canvas.width/scale
            screenSizeY = canvas.height/scale

            if (playerSlot >= 0) {
                // Grid
                ctx.fillStyle = '#f7f8ff'
                ctx.fillRect(-screenSizeX/2, -screenSizeY/2, screenSizeX, screenSizeY)

                ctx.strokeStyle = `#000000${toHex(0.03)}`
                ctx.lineWidth = 1
                ctx.beginPath()
                for (let x = Math.floor((cameraX-screenSizeX/2)/10)*10; x <= cameraX+screenSizeX/2; x += 10) {
                    ctx.moveTo(x-cameraX, -screenSizeY/2)
                    ctx.lineTo(x-cameraX, screenSizeY/2)
                }
                for (let y = Math.floor((cameraY-screenSizeY/2)/10)*10; y <= cameraY+screenSizeY/2; y += 10) {
                    ctx.moveTo(-screenSizeX/2, y-cameraY)
                    ctx.lineTo(screenSizeX/2, y-cameraY)
                }
                ctx.stroke()

                // Entities - no: en titties :P
                // yes i used the same joke from old.cobbled.io's and old.flingy.io's code, cry about it     // Players <-- for ctrl+f
                for (let i = 0; i < lobby.config.playerLimit; i++) {
                    //todo
                }

                // HUD canvas

                gap = 12*(fov/1080)*settings.uiScale

                // Minimap
                if (settings.showMinimap) {
                    let size = 45*settings.uiScale
                    let mx = screenSizeX/2-size-gap
                    let my = screenSizeY/2-size-gap
                    let k = size/lobby.borderRadius
                    //draw
                }

                // Debug
                if (settings.showDebugActivation == 'toggle' ? debugOpen : isKeyPressed('i')) {
                    ui.hud.leaveButton.style.visibility = 'hidden'
                    drawText(
`=== PERFORMANCE === (I to close)
FPS: ${fpsAvg.toFixed(1)} avg (${fpsLast.toFixed(1)} last)
MSPF: ${mspfAvg.toFixed(1)} avg (${mspfLast.toFixed(1)} last)
Server TPS: ${lobby.tps.toFixed(1)}
Resolution: ${canvas.width}x${canvas.height} (${settings.resolutionScale}x of ${Math.round(innerWidth*devicePixelRatio)}x${Math.round(innerHeight*devicePixelRatio)})

=== NETWORK ===
Ping: #ms avg (#ms last)
Packet Timing: last: ${prev ? `${(curr.timestamp-prev.timestamp).toFixed(1)}` : `n/a`}ms, current: ${prev ? (performance.now()-curr.timestamp).toFixed(1) : 'n/a'}ms
Ready: ${ws ? ws.readyState : 'none'}
Buffered: ${ws ? ws.bufferedAmount : 'none'}
Smoothing: ${settings.smoothing == 'predict' ? 'interpolation' : settings.smoothing}

=== LOBBY INFO === 
ID: ${lobby.id} (${lobby.url})
Gamemode: ${lobby.config.gamemode}
Closing: ${lobby.closing ? `after this match` : `not yet`}

=== PLAYER ===
Camera: (${Math.round(cameraX)}, ${Math.round(cameraY)})

=== MISC ===
Server Count: ${Object.keys(servers || {}).length}
Invalid Servers: ${JSON.stringify(invalidServers)}
`, -screenSizeX/2+4+gap, -screenSizeY/2+4+gap, clamp(4/settings.resolutionScale, 8, 12), '#000000', '#ffffff', 1, 0, 'left', 'down')
                } else if (settings.showPerformanceActivation == 'toggle' ? performanceOpen : isKeyPressed('f')) {
                    ui.hud.leaveButton.style.visibility = 'hidden'
                    drawText(
`=== SHORTENED === (F to close)
FPS: ${fpsAvg.toFixed(1)} avg (${fpsLast.toFixed(1)} last)
MSPF: ${mspfAvg.toFixed(1)} avg (${mspfLast.toFixed(1)} last)
Res: ${canvas.width}x${canvas.height} (${settings.resolutionScale}x)
Ping: #ms avg (#ms last). For now, you get:
Packet Timing: last: ${prev ? `${(curr.timestamp-prev.timestamp).toFixed(1)}` : `n/a`}ms, current: ${prev ? (performance.now()-curr.timestamp).toFixed(1) : 'n/a'}ms
`, -screenSizeX/2+4+gap, -screenSizeY/2+4+gap, clamp(4/settings.resolutionScale, 8, 32), '#000000', '#ffffff', 1, 0, 'left', 'down')
                } else {ui.hud.leaveButton.style.visibility = 'visible'}
                if (settings.renderDebugActivation == 'toggle' ? renderDebugOpen : isKeyPressed('o')) {
                    for (let i = 0; i < playerColors.length; i++) {
                        let size = 30
                        drawRect(((i-(playerColors.length-1)/2)*size)-size/2, -screenSizeY/2+size/2, size, size, colors.fill[playerColors[i]], colors.outline[playerColors[i]], 2)
                        drawText(playerColors[i], ((i-(playerColors.length-1)/2)*size)-size/2, -screenSizeY/2+size+6, 7, colors.fill[playerColors[i]], colors.outline[playerColors[i]], 1)
                    }
                }
                
            }
            
            menuBgX += (-mouseX*0.03-menuBgX)*(1-Math.pow(0.64,dt))
            menuBgY += (-mouseY*0.03-menuBgY)*(1-Math.pow(0.64,dt))
            if (menuBgImg.complete && menuBgImg.naturalWidth) {
                let ratio = menuBgImg.width/menuBgImg.height
                let dw = Math.max(canvas.width, canvas.height*ratio)*1.1/scale
                let dh = dw/ratio
                animations.bgImage.opacity += ((scene == 0 ? 1 : 0)*2-1)*(dt/(15*settings.animationTime))
                animations.bgImage.opacity = clamp(animations.bgImage.opacity, 0, 1)
                if (animations.bgImage.opacity != 0) {
                    ctx.globalAlpha = animations.bgImage.opacity
                    ctx.drawImage(menuBgImg, -dw/2+menuBgX/scale, -dh/2+menuBgY/scale, dw, dh)
                    ctx.globalAlpha = 1
                }
            }

            // fps // performance
            fpsFrames++
            if (now-fpsWindow >= 1000) {
                fpsLast = fpsAvg
                fpsAvg = fpsFrames*1000/(now-fpsWindow)
                fpsFrames = 0
                fpsWindow = now
            }

            mspfSum += performance.now()-frameStart
            mspfCount++
            if (mspfCount >= 60) {
                mspfLast = mspfAvg
                mspfAvg = mspfSum/mspfCount
                mspfSum = 0
                mspfCount = 0
            }
        }

        function localStorageLoop() {
            try{statusMessage = JSON.parse(getStoredKey('cobbled_v4_statusMessage'))} catch {statusMessage = null}
            renderStatus(statusMessage)

            storageVersion = getStoredKey('cobbled_v4_version') || ''
            if (storageVersion == 'v4.0.0+') {
                // load existing data
                console.log(`loading save data (${storageVersion})`)

                username = getStoredKey('cobbled_v4_username')
                if (username) {ui.menu.menuControls.username.value = username}

                try {unlockedColors = JSON.parse(getStoredKey('cobbled_v4_unlockedColors'))} catch(e) {unlockedColors = null}
                if (!unlockedColors || !unlockedColors.length) unlockedColors = ['red', 'orange', 'lime', 'blue']
                unlockedColors = unlockedColors.filter(c => playerColors.includes(c))
                unlockedColors.sort((a, b) => playerColors.indexOf(a)-playerColors.indexOf(b))
                
                playerColor = getStoredKey('cobbled_v4_playerColor') || unlockedColors[Math.floor(Math.random()*unlockedColors.length)]
                if (!unlockedColors.includes(playerColor)) {playerColor = unlockedColors[Math.floor(Math.random()*unlockedColors.length)]}
            
                coins = Number(getStoredKey('cobbled_v4_coins')) || 0

                try {Object.assign(settings, JSON.parse(getStoredKey('cobbled_v4_settings') || '{}'))} catch {}
                loadSettings()
            } else {
                // truly new user
                console.log(`creating new save data (${storageVersion})`)
                username = ''
                unlockedColors = ['red', 'orange', 'lime', 'blue']
                unlockedColors.sort((a, b) => playerColors.indexOf(a)-playerColors.indexOf(b))
                playerColor = unlockedColors[Math.floor(Math.random()*unlockedColors.length)]
                coins = 0
            }
            ui.menu.menuControls.colorButton.style.setProperty('--c', `var(--${playerColor})`)
            ui.menu.menuControls.colorButton.style.setProperty('--c-outline', `var(--${playerColor}-outline)`)

            setInterval(() => {
                setStoredKey('cobbled_v4_version', 'v4.0.0+')
                setStoredKey('cobbled_v4_username', username)
                setStoredKey('cobbled_v4_coins', coins.toString())
                setStoredKey('cobbled_v4_playerColor', playerColor)
                setStoredKey('cobbled_v4_unlockedColors', JSON.stringify(unlockedColors))
                setStoredKey('cobbled_v4_settings', JSON.stringify(settings))
            }, 3000)
        }

        menuBgImg = new Image()
        menuBgImg.src = 'images/cobbled.io red-replaced v2.png'

        changelogData = null
        fetch('changelog.json', {cache: 'no-store'})
            .then(r => r.json())
            .then(d => {
                changelogData = d
                if (changelogData) console.log('loaded changelog data')
                else console.log("couldn't load changelog data")
            })
            .catch(() => console.log("couldn't load changelog data"))

        settingsData = null
        fetch('settings.json', {cache: 'no-store'})
            .then(r => r.json())
            .then(d => {
                settingsData = d
                if (settingsData) console.log('loaded settings data')
                else console.log("couldn't load settings data")
            })
            .catch(() => console.log("couldn't load settings data"))

        function loadSettings() {
            resize()
            masterGain.gain.value = settings.volume
            document.documentElement.style.setProperty('--transition', settings.animationTime)
            document.documentElement.style.setProperty('--image-rendering', settings.imageScaling)
        }

        requestAnimationFrame(frame)
        localStorageLoop()
        tipsLoop()
        loadSounds(['bonus.opus','bwooop.opus','matchfound2.opus','negativeaction.opus','negativeaction2.opus'])
    </script>
