47-.084.06-28.723 11.869-48.91-15.539-42.292-36.056z'/%3E%3Cpath fill='none' stroke='%23fff' stroke-linecap='round' stroke-width='8' d='m45.37 112.795 22.291 3.499 3.555 22.296-20.201 10.44-16.07-16.09zM67.506 116.25 88.374 95.38'/%3E%3C/g%3E%3C/svg%3E">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @font-face {
            font-family: "Ubuntu";
            src: url("fonts/ubuntu-light.woff2") format("woff2");
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Ubuntu";
            src: url("fonts/ubuntu-lightitalic.woff2") format("woff2");
            font-weight: 300;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: "Ubuntu";
            src: url("fonts/ubuntu-regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Ubuntu";
            src: url("fonts/ubuntu-italic.woff2") format("woff2");
            font-weight: 400;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: "Ubuntu";
            src: url("fonts/ubuntu-medium.woff2") format("woff2");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Ubuntu";
            src: url("fonts/ubuntu-mediumitalic.woff2") format("woff2");
            font-weight: 500;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: "Ubuntu";
            src: url("fonts/ubuntu-bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Ubuntu";
            src: url("fonts/ubuntu-bolditalic.woff2") format("woff2");
            font-weight: 700;
            font-style: italic;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            border-radius: calc(8px*var(--ui));
            font-family: "Ubuntu", helvetica, arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        code {
            font-family: monospace;
        }
        
        #game {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #menu {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(0,0,0,0.2);
            border-radius: 0;
        }

        #logo {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: calc(128px*var(--ui));
            color: var(--red);
            -webkit-text-stroke: calc(12.8px*var(--ui)) var(--red-outline);
            paint-order: stroke fill;
            letter-spacing: calc(4px*var(--ui));
            font-weight: bold;
            user-select: none;
        }

        button {
            position: relative;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--c);
            border: calc(6px*var(--ui)) solid var(--c-outline);
            border-radius: calc(8px*var(--ui));
            transform: rotate(var(--angle, 0deg));
            z-index: -1;
            pointer-events: none;
        }

        .section {
            --c: var(--red);
            --c-outline: var(--red-outline);
            background: var(--c);
            border: calc(6px*var(--ui)) solid var(--c-outline);
            border-radius: calc(8px*var(--ui));
            &[open] {
                padding: 0 calc(12px*var(--ui)) calc(12px*var(--ui));
            }
        }

        .panel .section[open] > summary {
            width: auto;
            margin-left: calc(-12px*var(--ui));
            margin-right: calc(-12px*var(--ui));
        }

        .section summary {
            cursor: pointer;
            font-size: calc(30px*var(--ui));
            font-weight: bold;
            text-align: center;
        }

        .section-arrow {
            width: calc(24px*var(--ui));
            height: calc(24px*var(--ui));
            margin-left: auto;
            transition: transform calc(0.25s*var(--transition, 1));
            stroke: var(--c-outline);
        }

        .section[open] .section-arrow {
            transform: rotate(90deg);
        }

        #menu-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: calc(12px*var(--ui));
            #color-button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: calc(64px*var(--ui));
                height: calc(64px*var(--ui));
                --c: var(--red);
                --c-outline: var(--red-outline);
                color: var(--c-outline);
                box-sizing: border-box;
                padding: 0;
                cursor: pointer;
            }
            #username {
                width: calc(600px*var(--ui));
                height: calc(64px*var(--ui));
                font-size: calc(48px*var(--ui));
                border: calc(6px*var(--ui)) solid var(--gray);
                border-radius: calc(8px*var(--ui));
                box-sizing: border-box;
                text-align: center;
            }
            #play-button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: calc(64px*var(--ui));
                height: calc(64px*var(--ui));
                --c: var(--lime);
                --c-outline: var(--lime-outline);
                color: var(--c-outline);
                box-sizing: border-box;
                padding: 0;
                cursor: pointer;
                .icon {display: none;}
                .icon-play {display: block;}
                &.waiting {
                    --c: var(--red);
                    --c-outline: var(--red-outline);
                    .icon {display: none;}
                    .icon-x {display: block;}
                }
                &.retry {
                    --c: var(--yellow);
                    --c-outline: var(--yellow-outline);
                    .icon {display: none;}
                    .icon-retry {display: block;}
                }
                &.finished {
                    --c: var(--lime);
                    --c-outline: var(--lime-outline);
                    .icon {display: none;}
                    .icon-finished {display: block;}
                }

            }
        }

        #message {
            position: absolute;
            top: calc(50% + 44px*var(--ui));
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: calc(30px*var(--ui));
        }

        #status {
            position: absolute;
            top: calc(12px*var(--ui));
            left: calc(12px*var(--ui));
            max-width: calc(450px*var(--ui));
            padding: calc(6px*var(--ui));background: var(--c);
            border: calc(6px*var(--ui)) solid var(--c-outline);
            border-radius: calc(8px*var(--ui));
            color: black;
            font-size: calc(30px*var(--ui));
            white-space: pre-wrap;
        }

        #server-list {
            /* ARE YOU EVER CODE ME IN!? */
        }

        #shop {
            position: absolute;
            top: calc(12px*var(--ui));
            right: calc(12px*var(--ui));
            display: flex;
            flex-direction: row;
            gap: calc(12px*var(--ui));
            #flings {
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                padding: 0;
                color: black;
                font-size: calc(30px*var(--ui));
                white-space: pre-wrap;
                user-select: none;
            }
            #buy-color {
                display: flex;
                align-items: center;
                justify-content: center;
                width: calc(256px*var(--ui));
                height: calc(64px*var(--ui));
                --c: var(--gray);
                --c-outline: var(--gray-outline);
                color: var(--c-outline);
                box-sizing: border-box;
                padding: 0;
                cursor: pointer;
                color: black;
                font-size: calc(30px*var(--ui));
                font-weight: bold;
                white-space: pre-wrap;
                user-select: none;
                &.rich {
                    opacity: 1;
                    display: block;
                }
                &.poor {
                    opacity: 0.5;
                    display: block;
                }
                &.maxed {
                    display: none;
                }
            }
        }

        #bottom-row {
            position: absolute;
            bottom: calc(12px*var(--ui));
            left: calc(12px*var(--ui));
            display: flex;
            flex-direction: row;
            align-items: left;
            gap: calc(12px*var(--ui));
            #settings-button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: calc(64px*var(--ui));
                height: calc(64px*var(--ui));
                --c: var(--gray);
                --c-outline: var(--gray-outline);
                color: var(--c-outline);
                box-sizing: border-box;
                padding: 0;
                cursor: pointer;
            }
            #changelog-button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: calc(64px*var(--ui));
                height: calc(64px*var(--ui));
                --c: var(--orange);
                --c-outline: var(--orange-outline);
                color: var(--c-outline);
                box-sizing: border-box;
                padding: 0;
                cursor: pointer;
            }
            #discord-button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: calc(64px*var(--ui));
                height: calc(64px*var(--ui));
                --c: var(--blue);
                --c-outline: var(--blue-outline);
                color: var(--c-outline);
                box-sizing: border-box;
                padding: 0;
                cursor: pointer;
            }

        }

        #tips {
            position: absolute;
            bottom: calc(12px*var(--ui));
            left: 50%;
            transform: translateX(-50%);
            font-size: calc(24px*var(--ui));
            color: #000000;
            transition: opacity calc(1s*var(--transition, 1));
            white-space: nowrap;
        }

        .icon {
            width: calc(44px*var(--ui));
            height: calc(44px*var(--ui));
            display: block;
            stroke-width: 3;
        }

        #settings-panel {
            background: var(--gray);
            border: calc(6px*var(--ui)) solid var(--gray-outline);
            outline: var(--gray-outline);
            scrollbar-width: none;
        }
        #settings-panel::-webkit-scrollbar {
            display: none;
        }
        #changelog-panel {
            background: var(--orange);
            border: calc(6px*var(--ui)) solid var(--orange-outline);
            outline: var(--orange-outline);
            scrollbar-width: none;
        }
        #changelog-panel::-webkit-scrollbar {
            display: none;
        }
        .panel {
            position: fixed;
            top: calc(12px*var(--ui));
            left: calc(-450px*var(--ui));
            bottom: calc(88px*var(--ui));
            width: calc(450px*var(--ui));
            transition: left calc(0.25s*var(--transition, 1));
            padding: calc(12px*var(--ui));
            overflow-y: auto;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: calc(12px*var(--ui));
            &.open {left: calc(12px*var(--ui));}

            .title {
                font-size: calc(40px*var(--ui));
                font-weight: bold;
                margin: 0 auto;
                color: #ffffff;
                -webkit-text-stroke: calc(4px*var(--ui)) #000000;
                paint-order: stroke fill;
                text-align: center;
                cursor: pointer;
            }
            .section summary {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                width: 100%;
                --c: var(--red);
                --c-outline: var(--red-outline);
                color: var(--c-outline);
                box-sizing: border-box;
                padding: calc(12px*var(--ui));
                cursor: pointer;
                font-size: calc(30px*var(--ui));
                font-weight: bold;
                margin: 0 auto;
                color: #ffffff;
                -webkit-text-stroke: calc(3px*var(--ui)) #000000;
                paint-order: stroke fill;
                text-align: center;
            }
            .button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 15%;
                --c: var(--red);
                --c-outline: var(--red-outline);
                color: var(--c-outline);
                box-sizing: border-box;
                padding: 0;
                cursor: pointer;
                font-size: calc(30px*var(--ui));
                font-weight: bold;
                margin: 0 auto;
                color: #ffffff;
                -webkit-text-stroke: calc(3px*var(--ui)) #000000;
                paint-order: stroke fill;
                text-align: center;
            }
            .label {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                color: var(--c-outline);
                box-sizing: border-box;
                padding: 0;
                font-size: calc(20px*var(--ui));
                font-weight: bold;
                margin: 0 auto;
                color: #ffffff;
                -webkit-text-stroke: calc(2px*var(--ui)) #000000;
                paint-order: stroke fill;
                text-align: center;
                input[type="checkbox"] {
                    appearance: none;
                    width: calc(28px*var(--ui));
                    height: calc(28px*var(--ui));
                    background: var(--white);
                    border: calc(6px*var(--ui)) solid var(--c-outline);
                    margin: 0;
                    cursor: pointer;
                }
                input[type="checkbox"]:checked {
                    background: var(--c);
                    /*
                    background-image:
                        linear-gradient(45deg,
                            transparent calc(50% - 3px*var(--ui)),
                            var(--white-outline) calc(50% - 3px*var(--ui)),
                            var(--white-outline) calc(50% + 3px*var(--ui)),
                            transparent calc(50% + 3px*var(--ui))),
                        linear-gradient(-45deg,
                            transparent calc(50% - 3px*var(--ui)),
                            var(--white-outline) calc(50% - 3px*var(--ui)),
                            var(--white-outline) calc(50% + 3px*var(--ui)),
                            transparent calc(50% + 3px*var(--ui)));
                    */
                    border: calc(6px*var(--ui)) solid var(--c-outline);
                    cursor: pointer;
                }
                input[type="range"] {
                    appearance: none;
                    background: var(--white);
                    box-shadow: inset 0 0 0 calc(6px*var(--ui)) var(--white-outline);
                    width: calc(128px*var(--ui));
                    height: calc(20px*var(--ui));
                }
                input[type="range"]::-webkit-slider-thumb {
                    -webkit-appearance: none;
                    width: calc(28px*var(--ui));
                    height: calc(28px*var(--ui));
                    background: var(--c);
                    border: calc(6px*var(--ui)) solid var(--c-outline);
                    border-radius: calc(8px*var(--ui));
                    cursor: pointer;
                }
                .value {
                    margin-left: auto;
                }
            }
            .subtitle {
                font-size: calc(25px*var(--ui));
                font-weight: bold;
            }
            .text {
                font-size: calc(20px*var(--ui));
                font-weight: normal;
            }
            .point::before {
                content: "- ";
            }
            .point {
                font-size: calc(20px*var(--ui));
                font-weight: normal;
                .point {
                    margin-left: calc(12px*var(--ui));
                }
            }
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="menu">
        <div id="logo">FLINGY.IO</div>
        <div id="menu-controls"> <!-- better name? -->
            <button id="color-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-palette"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            </button>
            <input id="username" maxlength="20" placeholder="Enter username..." autocomplete="off" spellcheck="false">
            <button id="play-button" class="idle">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-play"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-finished"><path d="M20 6 9 17l-5-5"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-retry"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        <div id="message">Pick a color and play!</div>
        <div id="status"></div>
        <div id="server-list"></div>
        <div id="shop">
            <div id="flings">Flings: #🪙</div>
            <button id="buy-color" title="Buy a random color! (# left)">Buy Color: #🪙</button>
        </div>
        <div id="bottom-row">
            <button id="settings-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button id="changelog-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-changelog"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>

        function colorsToHex(color) {
            switch (color) {
                case 'red': return '#ff6666'
                case 'coral': return '#ff9966'
                case 'orange': return '#ffc266'
                case 'yellow': return '#ffe766'
                case 'lime': return '#87e65c'
                case 'green': return '#71bf4d'
                case 'blue': return '#6696ff'
                case 'purple': return '#9966ff'
                case 'pink': return '#fc66ff'
                case 'tan': return '#ffccb3'
                case 'navy': return '#4d71bf'
                case 'brown': return '#bf734d'
                case 'maroon': return '#bf4d4d'
                case 'burgundy': return '#bf4d76'
                case 'magenta': return '#ff66af'
                case 'cyan': return '#5ce6e6'
                case 'leaf': return '#5ce693'
                case 'black': return '#333333'
                case 'gray': return '#bfbfbf'
                case 'white': return '#f2f2f2'
                case 'special': {
                    t = Date.now()/640
                    start = [255,102,102]
                    end = [255,128,166]
                    factor = 0.5+0.5*Math.sin(t)
                    r = Math.round(start[0]+(end[0]-start[0])*factor)
                    g = Math.round(start[1]+(end[1]-start[1])*factor)
                    b = Math.round(start[2]+(end[2]-start[2])*factor)
                    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`
                }
                default: return '#ff00ff'
            }
        }

        function colorsToOutlineHex(color) {
            switch (color) {
                case 'red': return '#bf4d4d'
                case 'coral': return '#bf734d'
                case 'orange': return '#bf914d'
                case 'yellow': return '#bfad4d'

                case 'purple': return '#734dbf'

                case 'tan': return '#bf9986'

                case 'brown': return '#804d33'
                case 'maroon': return '#803333'
                case 'burgundy': return '#80334f'
                case 'magenta': return '#bf4d84'
                case 'cyan': return '#4dbfbf'
                case 'leaf': return '#4dbf7a'
                case 'black': return '#262626'
                case 'gray': return '#999999'
                case 'white': return '#bfbfbf'
                case 'special': {
                    t = Date.now()/640
                    start = [191,77,77]
                    end = [191,96,124]
                    factor = 0.5+0.5*Math.sin(t)
                    r = Math.round(start[0]+(end[0]-start[0])*factor)
                    g = Math.round(start[1]+(end[1]-start[1])*factor)
                    b = Math.round(start[2]+(end[2]-start[2])*factor)
                    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`
                }
                default: return '#ff0000'
            }
        }

        function renderNodes(parent, nodes) {
            for (let node of nodes) {
                switch (node.type) {

                        details.append(summary)
                        summary.onclick = () => {
                            playSound('bwooop', 1, randomFloat(0.9,1.1))
                        }

                        parent.append(details)
                        renderNodes(details, node.children)
                        
                    } break
                    case 'button': {
                        let e = document.createElement(`button`)
                        e.className = 'button'
                        e.textContent = node.label
                        e.style.setProperty('--c', `var(--${node.color})`)
                        e.style.setProperty('--c-outline', `var(--${node.color}-outline)`)
                        e.style.height = node.height || '15%'

                        parent.append(e)

                    case 'toggle': {
                        let e = document.createElement(`div`)
                        e.className = 'label'
                        e.textContent = node.label

                        let input = document.createElement('input')
                        input.type = 'checkbox'
                        input.checked = !!settings[node.setting]
                        input.addEventListener('change', () => {
                            settings[node.setting] = input.checked

                        e.append(input)
                        parent.append(e)
                    } break
                    case 'slider': {
                        let label = document.createElement(`div`)
                        label.className = 'label'

                        let value = document.createElement(`div`)
                        value.className = 'value'
                        value.textContent = settings[node.setting].toFixed(2)

                        let input = document.createElement('input')
                        input.type = 'range'
                        input.min = node.min
                        input.max = node.max
                        input.step = node.step
                        input.value = settings[node.setting]
                        input.addEventListener('input', () => {
                            value.textContent = Number(input.value).toFixed(2)
                        })
                        input.addEventListener('change', () => {
                            settings[node.setting] = Number(input.value)
                            value.textContent = Number(input.value).toFixed(2)
                            loadSettings()
                        })

                        label.append(value)

                        parent.append(label)
                    } break

                    // changelog stuff
                    case 'text': {

                        text.className = 'point'
                        text.textContent = node.label

                        parent.append(text)
                        if (node.children) {renderNodes(text, node.children)}

        function pickServer() {
            console.log(`Picking server...`)

            let available = []

            for (const id in servers) {
                if (invalidServers[id]) continue
                if (Date.now()-(servers[id].lastSeen || 0) > 10*60*1000) continue
                if (servers[id].status != 0) continue
                available.push({id: id, players: servers[id].playerCount || 0})
            }

            if (available.length == 0 && Object.keys(invalidServers).length) {
                invalidServers = {}
            }

            if (available.length == 0) {
                console.log("no joinable servers")
                animations.playButton.result = Object.keys(servers || {}).length == 0 ? 2 : 3
                playSound('negativeaction2')
                ui.menu.message.textContent = `No joinable servers`
                setTimeout(() => {
                    animations.playButton.state = 2
                }, 100)
                // in the future, make it wait for a server to be available, since that's the point after all
                return
            }

            available.sort((a,b) => b.players-a.players)

            server = available[0]
            connect(server.id, servers[server.id].url)
        }

        function connect(id, url) {
            if (ws) ws.close()

            console.log(`Connecting to server: ${id} (${url})`)
            ui.menu.message.textContent = `Connecting to lobby ${server.id.replace(/^flingy_/, '')}`
            ws = new WebSocket(url)
            ws.binaryType = "arraybuffer"
            
            ws.addEventListener('open', () => {
                console.log(`Connected to websocket of server ${id} (${url})`)
                ws.send(encodePacket(-1, id))
            })

            ws.addEventListener('message', (event) => {
                decodePacket(event.data)
            })

            ws.addEventListener('close', (event) => {
                console.log(`Disconnected from server ${id} (${url}) - Code: ${event.code}, Reason: ${event.reason}, WasClean: ${event.wasClean}`)
            })

            ws.addEventListener('error', () => {
                console.log(`Connection error on server ${id} (${url})`)
            })
        }

        function encodePacket(packetType, data) {
            version = 1
            switch (packetType) {
                case -1: {
                    let text = new TextEncoder().encode(data)

                    let bufferSize = 2+1+text.length
                    let buffer = new ArrayBuffer(bufferSize)
                    let packet = new DataView(buffer)
                    let i = 0
                    packet.setUint8(i, version) ;i += 1
                    packet.setInt8(i, packetType) ;i += 1

                    packet.setUint8(i, text.length, true) ;i += 1
                    for (let j=0; j < text.length; j++) {
                        packet.setUint8(i+j, text[j])
                    }
                    i += text.length

                    return packet
                }
                default: console.warn(`idk what packet ${packetType} is`) ;return null
            }
        }
        
        function decodePacket(data) {
            let packet = new DataView(data)
            let i = 0
            let version = packet.getUint8(i) ;i += 1
            if (version != 1) {console.warn(`outdated version ${version}, wtf!?`); return}
            let packetType = packet.getInt8(i) ;i += 1
            switch (packetType) {
                case 1: {
                    playerSlot = packet.getUint8(i) ;i += 1
                    console.log(`Connected to lobby as player ${playerSlot}`)
                    ui.menu.message.textContent = `Connected to lobby ${server.id.replace(/^flingy_/, '')}`
                    animations.playButton.result = 1
                    playSound('matchfound')
                    animations.playButton.state = 1
                    setTimeout(() => {
                        animations.playButton.state = 2
                    }, 500)
                } break
                case 2: {
                    disconnectReason = packet.getUint8(i) ;i += 1
                    console.log(`Disconnected for reason ${disconnectReason}`)

                    if (disconnectReason == 1) invalidServers[server.id] = true
                    disconnectReasons = {
                        1: `Lobby ${server.id.replace(/^flingy_/, '')} doesn't exist`,
                        2: `Lobby ${server.id.replace(/^flingy_/, '')} is full`,
                        3: `Duplicate connection to ${server.id.replace(/^flingy_/, '')}`,
                    }
                    ui.menu.message.textContent = disconnectReasons[disconnectReason]
                    animations.playButton.result = 2
                    animations.playButton.state = 2
                    playSound('negativeaction2')
                    ws.close()
                } break
                default: console.warn(`idk what packet ${packetType} is`) ;break
            }
            
        }

        // init
        server = null
        servers = {}
        invalidServers = {}
        lobby = {
            config: {},
            tick: -1,
            running: false,
            closing: false,
            player: [],
        }
        tips = [
            "DRINK WATER",
            "Spin to grow your flail!",
            "Flails get harder to turn the heavier they get.",
            "Left click to release your flail!",
            //"Press I/F to show debug or fps/ping",
            "Don't spin too fast! or you'll wrap back around the other way.",
            "Each kill gives 1 fling. Spend them to unlock colors!",
            "<-- Flex your fling count in the DISCORD!",
            "SPIN SPIN SPIN SPIN SPIN SPIN SPIN SPIN",
            "I am super proud of this UI :D",
            "This game was NOT vibe-coded.",
        ]
        settings = {
            uiScale: 1,
            volume: 1,
            transitionSpeed: 1,
            spinSpeed: 1,
            showLeaderboard: true,
            showMinimap: true,
        }
        playerSlot = undefined
        playerColor = 'red'
        playerColors = ['red', 'coral', 'orange', 'yellow', 'lime', 'green', 'leaf', 'cyan', 'blue', 'navy', 'purple', 'magenta', 'pink', 'burgundy', 'maroon', 'brown', 'tan', 'white', 'gray', 'black']
        unlockedColors = []
        remainingColors = []
        colorPrice = Infinity
        changelogOpen = false
        settingsPage = 0
        menuBgX = 0
        menuBgY = 0
        ws = null
        resize()
        

        // render loop
        lastFrame = performance.now()

        function frame(now) {
            let dt = Math.min((now-lastFrame)/1000*30, 1.5)
            lastFrame = now

            // render shit

            menuBgX += (-mouseX*0.03-menuBgX)*(1-Math.pow(0.64,dt))
            menuBgY += (-mouseY*0.03-menuBgY)*(1-Math.pow(0.64,dt))
            if (menuBgImg.complete && menuBgImg.naturalWidth) {
                let ratio = menuBgImg.width/menuBgImg.height
                let dw = Math.max(canvas.width, canvas.height*ratio)*1.1
                let dh = dw/ratio
                ctx.save()
                ctx.translate(canvas.width, canvas.height)
                ctx.scale(-1, -1)
                ctx.drawImage(menuBgImg, canvas.width/2-dw/2+menuBgX, canvas.height/2-dh/2+menuBgY, dw, dh)
                ctx.restore()
            }

            // html ui

            remainingColors = playerColors.filter(c => !unlockedColors.includes(c))
            colorPrice = unlockedColors.length-3

            ui.menu.shop.buyColor.classList.toggle('poor', coins < colorPrice)
            ui.menu.shop.buyColor.classList.toggle('rich', coins >= colorPrice && remainingColors.length != 0)
            ui.menu.shop.buyColor.classList.toggle('maxed', remainingColors.length == 0)
            ui.menu.shop.flings.textContent = `Flings: ${coins}🪙`
            
            // button animations
            switch (animations.colorButton.type) {
                case 0: {
                    ui.menu.shop.buyColor.textContent = `Buy Color: ${colorPrice}🪙`
                    ui.menu.shop.buyColor.style.setProperty('--c', `var(--${remainingColors[Math.floor(Date.now()/1000)%remainingColors.length]})`)
                    ui.menu.shop.buyColor.style.setProperty('--c-outline', `var(--${remainingColors[Math.floor(Date.now()/1000)%remainingColors.length]}-outline)`)
                } break
                case 1: {
                    ui.menu.shop.buyColor.textContent = `Spinning...`
                    switch (animations.colorButton.state) {
                        case 1: {
                            animations.colorButton.time += dt/settings.spinSpeed
                            if (animations.colorButton.time >= 15) {
                                animations.colorButton.state = 2
                            }
                            animations.colorButton.speed += animations.colorButton.acceleration*dt/settings.spinSpeed
                            animations.colorButton.speed *= Math.pow(0.98, dt/settings.spinSpeed)
                            animations.colorButton.angle += animations.colorButton.speed*dt/settings.spinSpeed
                        } break
                        case 2: {
                            let threshold = 0.25
                            animations.colorButton.speed *= Math.pow(0.98, dt/settings.spinSpeed)
                            animations.colorButton.angle += animations.colorButton.speed*dt/settings.spinSpeed
                            if (animations.colorButton.speed < threshold) {
                                animations.colorButton.type = 2
                                animations.colorButton.from = animations.colorButton.angle
                                animations.colorButton.to = Math.round(animations.colorButton.angle/90)*90
                                animations.colorButton.progress = 0
                                animations.colorButton.speed = 0
                                playerColor = remainingColors[animations.colorButton.result]
                                unlockedColors.push(playerColor)
                                unlockedColors.sort((a, b) => playerColors.indexOf(a)-playerColors.indexOf(b))
                                playSound('bonus')
                            }
                        } break
                    }

                    let crossing = Math.floor(animations.colorButton.angle/90)
                    if (crossing > animations.colorButton.lastCrossing) {
                        if (remainingColors.length > 1) {
                            let oldResult = animations.colorButton.result
                            animations.colorButton.result = randomInt(0,remainingColors.length-2)
                            if (animations.colorButton.result >= oldResult) animations.colorButton.result++
                        }
                        animations.colorButton.lastCrossing = crossing
                        playSound('bwooop', 1, randomFloat(0.9,1.1))
                    }

                    ui.menu.menuControls.colorButton.style.setProperty('--angle', animations.colorButton.angle + 'deg')
                    ui.menu.menuControls.colorButton.style.setProperty('--c', `var(--${remainingColors[animations.colorButton.result]})`)
                    ui.menu.menuControls.colorButton.style.setProperty('--c-outline', `var(--${remainingColors[animations.colorButton.result]}-outline)`)
                    ui.menu.shop.buyColor.style.setProperty('--c', `var(--${remainingColors[animations.colorButton.result]})`)
                    ui.menu.shop.buyColor.style.setProperty('--c-outline', `var(--${remainingColors[animations.colorButton.result]}-outline)`)
                    // also make the buy button the same color as this button!

                } break
                case 2: {
                    if (animations.colorButton.progress < 1) {
                        animations.colorButton.progress = Math.min(animations.colorButton.progress+dt/(7.5*settings.transitionSpeed), 1)
                        animations.colorButton.angle = animations.colorButton.from+(animations.colorButton.to-animations.colorButton.from)*animations.colorButton.progress*animations.colorButton.progress*(3-2*animations.colorButton.progress)
                        ui.menu.menuControls.colorButton.style.setProperty('--angle', animations.colorButton.angle + 'deg')
                        if (animations.colorButton.progress >= 1) {animations.colorButton.angle = animations.colorButton.from = animations.colorButton.to = animations.colorButton.type = 0}
                    }
                } break
            }

            switch (animations.playButton.type) {
                case 1: {
                    switch (animations.playButton.state) {
                        case 1: {
                            animations.playButton.time += dt
                            if (animations.playButton.time >= 3*30 && playerSlot == undefined) {
                                animations.playButton.result = 2
                                invalidServers[server.id] = true
                                ui.menu.message.textContent = `failed to connect to ${server.id.replace(/^flingy_/, '')}`
                                animations.playButton.state = 2
                                playSound('negativeaction2')
                                ws.close()
                            }
                            animations.playButton.speed += 3.58*dt/settings.spinSpeed
                            animations.playButton.speed *= Math.pow(0.905, dt/settings.spinSpeed)
                            animations.playButton.angle += animations.playButton.speed*dt/settings.spinSpeed
                        } break
                        case 2: {
                            let threshold = 0.1
                            animations.playButton.speed *= (Math.round((animations.playButton.angle+animations.playButton.speed*9.526)/90)*90-animations.playButton.angle)/(Math.round((animations.playButton.angle+animations.playButton.speed*9.526)/90)*90-animations.playButton.angle+(animations.playButton.speed-threshold)*dt/settings.spinSpeed)
                            animations.playButton.angle += animations.playButton.speed*dt/settings.spinSpeed
                            if (animations.playButton.speed < threshold) {
                                animations.playButton.type = 0
                                animations.playButton.state = 0
                                animations.playButton.angle = 0
                                animations.playButton.speed = 0
                                if (animations.playButton.result == 1) {animations.playButton.result = 0}
                            }
                        } break
                    }
                    ui.menu.menuControls.playButton.style.setProperty('--angle', animations.playButton.angle + 'deg')
                } break
            }
            ui.menu.menuControls.playButton.classList.toggle('waiting', animations.playButton.result === 3)
            ui.menu.menuControls.playButton.classList.toggle('retry', animations.playButton.result === 2)
            ui.menu.menuControls.playButton.classList.toggle('finished', animations.playButton.result === 1)

            if (animations.settingsButton.progress < 1) {
                animations.settingsButton.progress = Math.min(animations.settingsButton.progress+dt/(7.5*settings.transitionSpeed), 1)
                animations.settingsButton.angle = (3-2*animations.settingsButton.type)*90*animations.settingsButton.progress*animations.settingsButton.progress*(3-2*animations.settingsButton.progress)
                ui.menu.bottomRow.settingsButton.style.setProperty('--angle', animations.settingsButton.angle + 'deg')
                if (animations.settingsButton.progress >= 1) {animations.settingsButton.angle = 0}
            }
            if (animations.changelogButton.progress < 1) {
                animations.changelogButton.progress = Math.min(animations.changelogButton.progress+dt/(7.5*settings.transitionSpeed), 1)
                animations.changelogButton.angle = (3-2*animations.changelogButton.type)*90*animations.changelogButton.progress*animations.changelogButton.progress*(3-2*animations.changelogButton.progress)
                ui.menu.bottomRow.changelogButton.style.setProperty('--angle', animations.changelogButton.angle + 'deg')
                if (animations.changelogButton.progress >= 1) {animations.changelogButton.angle = 0}
            }
            if (animations.discordButton.progress < 1) {
                animations.discordButton.progress = Math.min(animations.discordButton.progress+dt/(7.5*settings.transitionSpeed), 1)
                animations.discordButton.angle = 180*animations.discordButton.progress*animations.discordButton.progress*(3-2*animations.discordButton.progress)
                ui.menu.bottomRow.discordButton.style.setProperty('--angle', animations.discordButton.angle + 'deg')
                if (animations.discordButton.progress >= 1) {animations.discordButton.angle = 0}
            }

            requestAnimationFrame(frame)
        }

        function localStorageLoop() {
            storageVersion = getStoredKey('flingy_v2_version') || ''
            if (storageVersion == 'v2.0.0+') {
                // load existing data
                console.log(`loading save data (${storageVersion})`)

                username = getStoredKey('flingy_v2_username')
                if (username) {ui.menu.menuControls.username.value = username}

                try {unlockedColors = JSON.parse(getStoredKey('flingy_v2_unlockedColors'))} catch(e) {unlockedColors = null}
                if (!unlockedColors || !unlockedColors.length) unlockedColors = ['red', 'orange', 'lime', 'blue']
                unlockedColors.sort((a, b) => playerColors.indexOf(a)-playerColors.indexOf(b))
                
                playerColor = getStoredKey('flingy_v2_playerColor') || unlockedColors[Math.floor(Math.random()*unlockedColors.length)]
                if (!unlockedColors.includes(playerColor)) {playerColor = unlockedColors[Math.floor(Math.random()*unlockedColors.length)]}
            
                coins = Number(getStoredKey('flingy_v2_coins')) || 0

                try {Object.assign(settings, JSON.parse(getStoredKey('flingy_v2_settings') || '{}'))} catch {}
                loadSettings()
            } else if (getStoredKey('flingy_username') != '') {
                // migrate from v1.1.3 // so far they voted to start fresh, so only username.
                console.log(`migrating save data from old flingy.io v1.1.3 (username only)`)

                username = getStoredKey('flingy_username') || ''
                if (username) {ui.menu.menuControls.username.value = username}

                //try {unlockedColors = JSON.parse(getStoredKey('flingy_unlockedColors'))} catch(e) {unlockedColors = null}
                //if (!unlockedColors || !unlockedColors.length) unlockedColors = ['red', 'orange', 'lime', 'blue']
                //unlockedColors.sort((a, b) => playerColors.indexOf(a)-playerColors.indexOf(b))
                
                //playerColor = getStoredKey('flingy_playerColor') || unlockedColors[Math.floor(Math.random()*unlockedColors.length)]
                //if (!unlockedColors.includes(playerColor)) {playerColor = unlockedColors[Math.floor(Math.random()*unlockedColors.length)]}
                
                //coins = Number(getStoredKey('flingy_coins')) || 0
            } else {
                // truly new user
                console.log(`creating new save data (${storageVersion})`)
                username = ''
                unlockedColors = ['red', 'orange', 'lime', 'blue']
                unlockedColors.sort((a, b) => playerColors.indexOf(a)-playerColors.indexOf(b))
                playerColor = unlockedColors[Math.floor(Math.random()*unlockedColors.length)]
                coins = 0
            }
            ui.menu.menuControls.colorButton.style.setProperty('--c', `var(--${playerColor})`)
            ui.menu.menuControls.colorButton.style.setProperty('--c-outline', `var(--${playerColor}-outline)`)

            setInterval(() => {
                setStoredKey('flingy_v2_version', 'v2.0.0+')
                setStoredKey('flingy_v2_username', ui.menu.menuControls.username.value || 'unnamed')
                setStoredKey('flingy_v2_coins', coins.toString())
                setStoredKey('flingy_v2_playerColor', playerColor)
                setStoredKey('flingy_v2_unlockedColors', JSON.stringify(unlockedColors))
                setStoredKey('flingy_v2_settings', JSON.stringify(settings))
            }, 3000)
        }

        menuBgImg = new Image()
        menuBgImg.src = 'images/menubackground.png'

        changelogData = []
        fetch('changelog.json').then(r => r.json()).then(d => changelogData = d)
        if (changelogData) {console.log(`loaded changelog data`)} else {console.log(`couldn't load changelog data`)}

        settingsData = []
        fetch('settings.json').then(r => r.json()).then(d => settingsData = d)
        if (settingsData) {console.log(`loaded settings data`)} else {console.log(`couldn't load settings data`)}

        async function loadSounds() {
            for (let name of soundNames) {
                try {
                    let response = await fetch(`sounds/${name}.ogg`)
                    soundBuffers[name] = await audio.decodeAudioData(await response.arrayBuffer())
                } catch (e) {
                    console.warn(`couldn't load ${name}`, e)
                }
            }
            console.log(`loaded ${Object.keys(soundBuffers).length} sounds`)
        }

        function loadSettings() {
            resize()
            masterGain.gain.value = settings.volume
            document.documentElement.style.setProperty('--transition', settings.transitionSpeed)
        }

        requestAnimationFrame(frame)
        localStorageLoop()
        loadSounds()

        tipIndex = 0
        ui.menu.tips.textContent = tips[tipIndex]
        ui.menu.tips.style.opacity = 1
        setInterval(() => {
            ui.menu.tips.style.opacity = 0
            setTimeout(() => {
                tipIndex = (tipIndex+1)%tips.length
                ui.menu.tips.textContent = tips[tipIndex]
                ui.menu.tips.style.opacity = 1
            }, 1000*settings.transitionSpeed)
        }, 10000)
    </script>
</body>
</html>
